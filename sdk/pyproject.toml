[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-sdk"
version = "1.0.0"
description = "WARDEN AI Agent Governance and Human Accountability Operating System SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["warden_sdk*"]
